name: Build macOS

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-mac:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      # ── JUCE: Standalone + VST3 ──────────────────────────────────────────
      - name: Configure JUCE
        working-directory: real-time/Plugin
        run: cmake -B build -G Xcode

      - name: Build JUCE Standalone + VST3
        working-directory: real-time/Plugin
        run: |
          cmake --build build --config Release --target AriaBridge_Standalone
          cmake --build build --config Release --target AriaBridge_VST3

      - name: Ad-hoc sign standalone
        working-directory: real-time/Plugin/build/AriaBridge_artefacts/Release/Standalone
        run: codesign --force --deep --sign - "Aria Bridge.app"

      - name: Stage JUCE artifacts into dist
        run: |
          mkdir -p dist
          cp -r "real-time/Plugin/build/AriaBridge_artefacts/Release/Standalone/Aria Bridge.app" "dist/Aria Bridge.app"
          cp -r "real-time/Plugin/build/AriaBridge_artefacts/Release/VST3/Aria Bridge.vst3" "dist/Aria Bridge.vst3"

      # ── Python backend → aria_backend ────────────────────────────────────
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          pip install pyinstaller
          pip install -r real-time/requirements.txt

      - name: Build aria_backend
        run: pyinstaller scripts/aria_backend.spec

      - name: Mark aria_backend executable
        run: chmod +x dist/aria_backend

      # ── Package release zip (plugin + backend as loose artifacts) ─────────
      # The Electron launcher was removed; ship the JUCE Standalone/VST3 plugin and
      # the PyInstaller backend directly. A new front-end will be rebuilt later.
      - name: Create release zip
        run: |
          ZIP="AriaBridge-${{ github.ref_name }}-macos.zip"
          STAGING="staging"
          mkdir -p "$STAGING/models" "$STAGING/feedback"

          cp -r "dist/Aria Bridge.app" "$STAGING/Aria Bridge.app"
          cp -r "dist/Aria Bridge.vst3" "$STAGING/Aria Bridge.vst3"
          cp "dist/aria_backend" "$STAGING/aria_backend"
          cp -r "real-time/ableton" "$STAGING/ableton"
          cp README.md "$STAGING/README.md"
          printf "Download model-gen.safetensors from HuggingFace and place it in this folder." \
            > "$STAGING/models/PUT_MODEL_HERE.txt"

          cd "$STAGING"
          zip -r --symlinks "../$ZIP" .

      - uses: actions/upload-artifact@v4
        with:
          name: release-mac
          path: AriaBridge-${{ github.ref_name }}-macos.zip

  release:
    runs-on: ubuntu-latest
    needs: [build-mac]
    # Only publish a GitHub Release on tag pushes. Manual (workflow_dispatch)
    # runs just leave the zip as a downloadable artifact on the run.
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-mac
          path: .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            AriaBridge-${{ github.ref_name }}-macos.zip
          body: See README.md for installation instructions.
